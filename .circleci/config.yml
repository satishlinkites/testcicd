version: 2.1

jobs:
  build-android:
    docker:
      - image: circleci/node:14
    steps:
      - checkout
      - run:
          name: Install Dependencies
          command: npm install
      - run:
          name: Set up Android SDK
          command: |
            echo "sdk.dir=/usr/local/android-sdk-linux" > android/local.properties
            yes | sdkmanager --licenses
      - run:
          name: Build Android APK
          command: ./gradlew assembleRelease
      - run:
          name: Install Firebase CLI
          command: npm install -g firebase-tools
      - run:
          name: Distribute Android APK
          command: |
            firebase appdistribution:distribute android/app/build/outputs/apk/release/app-release.apk \
            --app YOUR_ANDROID_APP_ID \
            --token $FIREBASE_TOKEN \
            --groups "testers"

  build-ios:
    macos:
      xcode: "14.0.0"
    steps:
      - checkout
      - run:
          name: Install Dependencies
          command: npm install
      - run:
          name: Install CocoaPods
          command: |
            sudo gem install cocoapods
            cd ios && pod install
      - run:
          name: Build iOS IPA
          command: |
            xcodebuild -workspace ios/YourApp.xcworkspace -scheme YourApp -sdk iphoneos -configuration AppStoreDistribution archive -archivePath $HOME/your-app.xcarchive
            xcodebuild -exportArchive -archivePath $HOME/your-app.xcarchive -exportOptionsPlist ios/exportOptions.plist -exportPath $HOME/your-app.ipa
      - run:
          name: Install Firebase CLI
          command: npm install -g firebase-tools
      - run:
          name: Distribute iOS IPA
          command: |
            firebase appdistribution:distribute $HOME/your-app.ipa \
            --app YOUR_IOS_APP_ID \
            --token $FIREBASE_TOKEN \
            --groups "testers"

workflows:
  version: 2
  build:
    jobs:
      - build-android
      - build-ios
